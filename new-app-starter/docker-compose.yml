services:
  myapp:
    build:
      context: .
      args:
        TEMPLATE_SHA: ${TEMPLATE_SHA:-unknown}
    container_name: myapp
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - APP_NAME=${APP_NAME:-myapp}
    volumes:
      - myapp_logs:/app/logs
      - myapp_server_files:/app/server_files
      # ── Uncomment if the app uses SQLite persistence ──
      # - myapp_database:/app/database
      #
      # ── Optional: NAS override for live template editing during development ──
      # Remove before committing.
      # - /mnt/nas/dev/myapp/templates:/app/templates
    restart: unless-stopped
    networks:
      - myapp-network

volumes:
  myapp_logs:
    driver: local
    driver_opts:
      type: nfs
      device: ":/Docker/myapp/logs"
      o: "nfsvers=4,addr=${NAS_IP:-192.168.0.134},nolock,soft,rw"

  myapp_server_files:
    driver: local
    driver_opts:
      type: nfs
      device: ":/Docker/myapp/server_files"
      o: "nfsvers=4,addr=${NAS_IP:-192.168.0.134},nolock,soft,rw"

  # ── Uncomment if the app uses SQLite persistence ──
  # myapp_database:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     device: ":/Docker/myapp/database"
  #     o: "nfsvers=4,addr=${NAS_IP:-192.168.0.134},nolock,soft,rw"

networks:
  myapp-network:
    driver: bridge
